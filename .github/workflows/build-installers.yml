name: build-installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve build cache path
        id: cachepath
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "path=$LOCALAPPDATA/Boquila/build-cache" >> "$GITHUB_OUTPUT"
          else
            echo "path=$HOME/.cache/boquila-build" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache build downloads (WiX / MinGit)
        uses: actions/cache@v4
        with:
          path: ${{ steps.cachepath.outputs.path }}
          key: boquila-cache-${{ runner.os }}

      - name: Build Windows installers (msi + exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version 1.0.0

      - name: Build Linux installer (deb)
        if: runner.os == 'Linux'
        run: |
          ./scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: boquila-installers-${{ runner.os }}
          path: target/dist/*
          if-no-files-found: error